[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cheesestack"
version = "0.1.0"
description = "Skeleton autonomy stack for CHEESECC: perception, localization, mapping, prediction, planning, control, safety, comms, sim, infra, ML."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cheesestack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
